name: Blog diário (DeepSeek + RSS + Unsplash)

# DESATIVADO em 19/07/2026 (Fase 1 da nova estratégia de conteúdo).
#
# Este pipeline gerava 1 artigo/dia a partir de RSS. Os 93 artigos que ele
# produziu foram removidos por recomendação da consultoria de SEO. O cron
# está comentado de propósito: se voltasse a rodar, ele repovoaria o blog
# com o conteúdo que acabamos de tirar do ar E quebraria o build, já que a
# rota /blog/[slug] está temporariamente desabilitada.
#
# Será SUBSTITUÍDO na Fase 2 pelo pipeline guiado pela planilha de
# cronograma (3 artigos/dia). Só então o agendamento volta.
on:
  # schedule:
  #   - cron: '23 13 * * *'
  workflow_dispatch: {}  # só disparo manual na aba Actions

concurrency:
  group: blog-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Gera artigo a partir do RSS
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          AMAZON_PARTNER_TAG: melhorlavaeseca-20
          SITE_URL: https://melhorlavaeseca.com
        run: npm run blog:from-rss

      - name: Commita artigo novo se houver
        run: |
          git config user.name "melhor-lava-e-seca-bot"
          git config user.email "bot@melhorlavaeseca.com"
          git add src/content/blog public/images/blog scripts/data 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nenhum artigo novo gerado hoje (RSS sem conteudo novo ou falha). Tudo bem."
            exit 0
          fi

          git commit -m "blog: novo artigo diário via RSS + DeepSeek"
          git push

      - name: Notifica Bing/Yandex via IndexNow
        if: success()
        continue-on-error: true
        run: npm run indexnow:latest
