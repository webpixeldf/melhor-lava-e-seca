name: Blog — 3 artigos por dia (cronograma editorial)

# Gera 1 artigo por execução, 3 vezes ao dia, a partir da fila em
# scripts/data/cronograma.json (planilha editorial da consultoria de SEO).
#
# Substitui o pipeline antigo de RSS, cujos 93 artigos foram removidos em
# 19/07/2026 por não agregarem valor.
#
# Por que 3 execuções separadas e não uma gerando 3: a cadência de publicação
# fica mais natural ao longo do dia, cada run é curto, e se uma falhar as
# outras duas continuam. Cron do GitHub usa UTC (BRT = UTC-3) e pode atrasar
# alguns minutos na fila.
on:
  schedule:
    - cron: '10 12 * * *'   # 09:10 BRT
    - cron: '10 17 * * *'   # 14:10 BRT
    - cron: '40 22 * * *'   # 19:40 BRT
  workflow_dispatch: {}     # disparo manual na aba Actions

# Impede que duas execuções mexam na fila ao mesmo tempo e gerem a mesma pauta.
concurrency:
  group: blog-cronograma
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # artigo de 3.500 palavras faz ~11 chamadas de API

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Gera o próximo artigo da fila
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          AMAZON_PARTNER_TAG: melhorlavaeseca-20
          SITE_URL: https://melhorlavaeseca.com
        run: node scripts/blog-from-cronograma.mjs --count 1

      - name: Valida o build antes de publicar
        # Artigo que quebra o build derrubaria o deploy do site inteiro.
        # Melhor descobrir aqui do que na Cloudflare.
        run: npm run build

      - name: Commita o artigo novo
        run: |
          git config user.name "melhor-lava-e-seca-bot"
          git config user.email "bot@melhorlavaeseca.com"

          # A linkagem retroativa altera artigos antigos, e o gerador atualiza
          # o status da pauta na fila. Tudo isso entra no commit.
          git add src/content/blog public/images/blog scripts/data 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nenhum artigo publicado nesta execucao."
            echo "Pode ser fila vazia ou artigo reprovado no portao de qualidade."
            exit 0
          fi

          TITULO=$(node -e "
            const fs=require('fs');
            const q=JSON.parse(fs.readFileSync('scripts/data/cronograma.json','utf8'));
            const pub=q.items.filter(i=>i.status==='publicado');
            console.log(pub.length ? pub[pub.length-1].title : 'novo artigo');
          ")

          git commit -m "blog: ${TITULO}"

          # npm ci (postinstall) e npm run build regeneram favicons e o
          # og-default a partir da marca. Entre maquinas o sharp/libvips gera
          # bytes um pouco diferentes, entao esses arquivos rastreados ficam
          # modificados na arvore. Nao entram no commit do artigo (o git add
          # acima e so de conteudo), e sobrando unstaged travam o rebase com
          # "cannot pull with rebase: You have unstaged changes". Como sao
          # apenas artefatos de build, descartamos antes de sincronizar.
          git checkout -- .

          # Outra execução pode ter publicado nesse meio tempo.
          git pull --rebase origin main
          git push

      - name: Notifica Bing/Yandex via IndexNow
        if: success()
        continue-on-error: true
        run: npm run indexnow:latest
