name: Blog — rascunhos para revisão editorial
on:
  schedule:
    - cron: '10 12 * * *'
    - cron: '10 17 * * *'
    - cron: '40 22 * * *'
  workflow_dispatch: {}
concurrency:
  group: blog-cronograma
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Prepara um rascunho sem alterar artigos publicados
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          AMAZON_PARTNER_TAG: melhorlavaeseca-20
          SITE_URL: https://melhorlavaeseca.com
        run: node scripts/blog-from-cronograma.mjs --count 1
      - name: Valida exportação e SEO
        run: npm run build && npm run seo:check && npm run test:editorial
      - name: Salva rascunho e fila
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/drafts scripts/data public/images/blog
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "blog: prepara rascunho para revisão editorial"
          # Resguarda somente artefatos gerados antes da sincronização.
          git stash push --include-untracked -m "artefatos de build"
          git pull --rebase origin main
          git push
